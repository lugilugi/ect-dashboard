# ECT backend Mosquitto broker (single-container deployment).
#
# Local-development defaults: anonymous, plaintext, no persistence.
# For production hardening (auth, ACLs, TLS) see ops/mosquitto/README.md.

listener 1883 0.0.0.0
allow_anonymous true

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# mosquitto refuses to run as root; the Debian package ships a `mosquitto`
# system user for this purpose.
user mosquitto

# ECT backend Mosquitto broker (single-container deployment).
#
# Local-development defaults: anonymous, plaintext, no persistence.
# QoS1 backlog survives broker restarts via the persistence file; for
# production hardening (auth, ACLs, TLS) see ops/mosquitto/README.md.

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /var/lib/mosquitto/

# Bounded queues for persistent-session clients (Telegraf + the vehicle app)
# so an offline client can never exhaust broker memory.
max_queued_messages 10000
max_inflight_messages 20
persistent_client_expiration 7d

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# mosquitto refuses to run as root; the Debian package ships a `mosquitto`
# system user for this purpose.
user mosquitto

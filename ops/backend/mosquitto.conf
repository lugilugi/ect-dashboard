# ECT backend Mosquitto broker (single-container deployment).
#
# Local-development defaults: anonymous, plaintext, persistent queues.
# QoS1 backlog survives broker restarts via the persistence file; for
# production hardening (auth, ACLs, TLS) see ops/mosquitto/README.md.

listener 1883 0.0.0.0
allow_anonymous true

persistence true
# Persistence file rewrite interval (seconds). A broker crash can lose up to
# this window of queued/unacked messages; that is covered by the phone's 7-day
# journal history and the reconcile tool. 1 s rewrote the whole save file
# every second, which is expensive with a deep backlog.
autosave_interval 30
persistence_location /var/lib/mosquitto/

# Bounded queues for persistent-session clients (Telegraf + the vehicle app)
# so an offline client can never exhaust broker memory.
# Byte budget per client: ~2 h of backlog at 400 records/s x ~450 B/event
# (~1.3 GB), rounded to 1.5 GB. Applies to QoS1/2 messages queued for
# persistent-session clients. Messages are batched envelopes (up to 32 KiB),
# so max_queued_messages is only a backstop (1.5 GB / 1 KiB small envelopes);
# it must not bind before the byte budget does.
max_queued_bytes 1500000000
max_queued_messages 1500000
# The phone keeps up to 8 batches in flight; the default of 20 leaves headroom.
max_inflight_messages 20
# Publish broker stats ($SYS/#) every 10 s; healthcheck.sh warns on
# $SYS/broker/messages/stored.
sys_interval 10
persistent_client_expiration 7d

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# mosquitto refuses to run as root; the Debian package ships a `mosquitto`
# system user for this purpose.
user mosquitto

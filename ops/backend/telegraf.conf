# Single-container Telegraf ingest config.
#
# All endpoints and topics are driven by environment variables so the same
# image works anywhere without rebuilds - defaults live in the Dockerfile
# and can be overridden with `docker run -e VAR=value`.
#
# Adding an MQTT topic later: copy one [[inputs.mqtt_consumer]] block, point
# `topics` at a new env var (e.g. ${TOPIC_COMMANDS}), and export it.

[agent]
  interval = "1s"
  flush_interval = "1s"
  metric_batch_size = 1000
  metric_buffer_limit = 20000
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["${TOPIC_EVENTS}"]
  qos = 1
  client_id = "ect-telegraf-timescale-single"
  persistent_session = true
  connection_timeout = "30s"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "telemetry_raw"

    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      # Signal values become fields; metadata becomes tags (kept off the
      # unpivoted signal rows via the tags list below).
      tags = [
        "session_uid",
        "lap_number",
        "ts_session_ms",
        "seq_in_session_start",
        "seq_in_session_end",
        # Consumed as the metric timestamp (see timestamp_key below), never
        # emitted as a real tag.
        "ts_wall_utc"
      ]
      # The wall-clock capture time is used as the metric timestamp rather
      # than an unpivoted signal, so replayed batches keep their original
      # timestamps. object-level timestamp_key + Go reference time is the
      # Telegraf 1.31 json_v2 syntax. NOTE: the key must NOT be listed in
      # excluded_keys - excluded keys are skipped before the timestamp is
      # applied (json_v2 parser bug/behavior), so it lives in the tags list
      # instead, where the timestamp branch wins.
      timestamp_key = "ts_wall_utc"
      timestamp_format = "2006-01-02T15:04:05.999999999Z07:00"

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["${TOPIC_SESSIONS}"]
  qos = 1
  client_id = "ect-telegraf-sessions-single"
  persistent_session = true
  connection_timeout = "30s"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "sessions_ingest_view"

    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      disable_prepend_keys = true
      # NOTE: only flat keys can be ingested. vehicle_setup is a nested JSON
      # object - json_v2 recurses into it (vehicle_setup_* fields) and would
      # clobber the whole metric batch (parser quirk), so it is deliberately
      # not included here. The sessions table keeps its vehicle_setup column
      # for manual/API use.
      included_keys = [
        "uid",
        "session_name"
      ]

# Convert dynamic fields into narrow signal_name/value columns
[[processors.unpivot]]
  namepass = ["telemetry_raw"]
  tag_key = "signal_name"
  value_key = "value"

[[outputs.postgresql]]
  connection = "host=${TS_HOST} port=${TS_PORT} user=${TS_USER} password=${TS_PASSWORD} dbname=${TS_DB} sslmode=disable"
  timestamp_column_name = "time"
  tagexclude = ["topic"]

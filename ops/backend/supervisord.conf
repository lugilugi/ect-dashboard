; ECT backend single-container process supervisor.
; All services run inside one container, so `docker run` gives you the whole
; backend: MQTT broker, database, ingest daemon, CSV logger/file server and
; dashboards.
;
; Ordering: postgres first (priority 10); telegraf retries its DB connection
; forever, so it self-heals if it starts before postgres is ready.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:postgres]
; The stock Timescale/Postgres entrypoint initializes the data dir on first
; boot and runs /docker-entrypoint-initdb.d/*.sql (the ECT schema) once.
command=/usr/local/bin/docker-entrypoint.sh postgres
priority=10
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mosquitto]
command=/usr/sbin/mosquitto -c /etc/mosquitto/mosquitto.conf
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:telegraf]
command=/usr/bin/telegraf --config /etc/telegraf/telegraf.conf
priority=30
autorestart=true
startsecs=0
user=telegraf
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:csv-server]
; Read-only HTTP download for server-side CSV exports (port 8080).
command=/usr/bin/python3 /usr/local/bin/csv_server.py
priority=35
autorestart=true
startsecs=0
user=telegraf
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:csv-streamer]
; Continuous MQTT -> CSV logger (per-session CSV files in $EXPORT_DIR).
command=/usr/bin/python3 /usr/local/bin/csv_streamer.py
priority=36
autorestart=true
startsecs=0
user=telegraf
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:grafana]
command=/usr/sbin/grafana-server --homepath=/usr/share/grafana
priority=40
autorestart=true
user=grafana
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

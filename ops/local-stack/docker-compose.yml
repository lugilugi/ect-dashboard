services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TELEGRAF_PASSWORD: ${TELEGRAF_PASSWORD:-telegraf}
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD:-grafana}
    ports:
      - "${TS_PORT:-5432}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ../../db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../backend/init_roles.sh:/docker-entrypoint-initdb.d/02_roles.sh:ro
      - ../../db/scripts/bootstrap_roles.sql:/etc/ect/bootstrap_roles.sql:ro
      # Server-side CSV export: script + writable export folder.
      - ../../ops/backend:/ops/backend:ro
      - ../../csv_exports:/exports
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB -Atc 'SELECT schema_sha256 FROM schema_metadata' | grep -qx $$(sha256sum /docker-entrypoint-initdb.d/01_schema.sql | cut -d' ' -f1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - telemetry_net

  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    init: true
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ../backend/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/var/lib/mosquitto
      - mosquitto_log:/mosquitto/log
    networks:
      - telemetry_net

  telegraf:
    image: telegraf:1.31.3
    volumes:
      - ../backend/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped
    init: true
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      TOPIC_EVENTS: ${TOPIC_EVENTS:-telemetry/eco_archers/events}
      TOPIC_SESSIONS: ${TOPIC_SESSIONS:-telemetry/eco_archers/sessions}
      TELEGRAF_EVENTS_CLIENT_ID: ect-telegraf-events-v2-compose
      TELEGRAF_SESSIONS_CLIENT_ID: ect-telegraf-sessions-v2-compose
      TS_HOST: timescaledb
      TS_PORT: 5432
      TS_DB: ${POSTGRES_DB:-telemetry}
      TS_USER: telegraf_ingest
      TS_PASSWORD: ${TELEGRAF_PASSWORD:-telegraf}
    networks:
      - telemetry_net

  csv-streamer:
    build:
      context: ../backend
      dockerfile: Dockerfile.csv-streamer
    depends_on:
      mosquitto:
        condition: service_started
    restart: unless-stopped
    init: true
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      TOPIC_EVENTS: ${TOPIC_EVENTS:-telemetry/eco_archers/events}
      TOPIC_SESSIONS: ${TOPIC_SESSIONS:-telemetry/eco_archers/sessions}
      EXPORT_DIR: /exports
      CSV_CLIENT_ID: ect-csv-v2-compose
    volumes:
      - ../../csv_exports:/exports
    networks:
      - telemetry_net

  csv-server:
    build:
      context: ../backend
      dockerfile: Dockerfile.csv-streamer
    command: ["python3", "/usr/local/bin/csv_server.py"]
    restart: unless-stopped
    init: true
    environment:
      EXPORT_DIR: /exports
      CSV_SERVER_PORT: 8080
    ports:
      - "${CSV_SERVER_PORT:-8080}:8080"
    volumes:
      - ../../csv_exports:/exports:ro
    networks:
      - telemetry_net

  grafana:
    image: grafana/grafana-oss:11.1.4
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
    init: true
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Machine-local timezone for dashboards (the machine viewing them).
      GF_DASHBOARDS_DEFAULT_TIMEZONE: browser
      TS_DATASOURCE_URL: timescaledb:5432
      TS_DATASOURCE_USER: grafana_reader
      TS_DATASOURCE_DB: ${POSTGRES_DB:-telemetry}
      TS_DATASOURCE_PASSWORD: ${GRAFANA_READER_PASSWORD:-grafana}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - telemetry_net

networks:
  telemetry_net:
    driver: bridge

volumes:
  timescaledb_data:
  mosquitto_data:
  mosquitto_log:
  grafana_data:

# Local-stack Telegraf ingest config.

[agent]
  interval = "1s"
  flush_interval = "1s"
  metric_batch_size = 1000
  metric_buffer_limit = 20000
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["telemetry/eco_archers/events"]
  qos = 1
  client_id = "ect-telegraf-timescale-local"
  persistent_session = true
  connection_timeout = "30s"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "telemetry_raw"

    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      tags = ["session_uid", "lap_number"]
      # Everything else automatically drops into the metric field engine
      included_keys = [] 

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["telemetry/eco_archers/sessions"]
  qos = 1
  client_id = "ect-telegraf-sessions-local"
  persistent_session = true
  connection_timeout = "30s"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "sessions_ingest_view"

    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      disable_prepend_keys = true
      included_keys = [
        "uid",
        "session_name",
        "vehicle_setup"
      ]

# Convert dynamic fields into narrow signal_name/value columns
[[processors.unpivot]]
  namepass = ["telemetry_raw"]
  tag_key = "signal_name"
  value_key = "value"

[[outputs.postgresql]]
  connection = "host=${TS_HOST} port=${TS_PORT} user=${TS_USER} password=${TS_PASSWORD} dbname=${TS_DB} sslmode=disable"
  timestamp_column_name = "time"
  tagexclude = ["topic"]

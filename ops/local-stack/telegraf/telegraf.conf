# Local-stack Telegraf ingest config.

[agent]
  interval = "1s"
  flush_interval = "1s"
  metric_batch_size = 1000
  metric_buffer_limit = 20000
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["telemetry/eco_archers/events"]
  qos = 1
  client_id = "ect-telegraf-timescale-local"
  persistent_session = true
  connection_timeout = "30s"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "telemetry_events"

    [[inputs.mqtt_consumer.json_v2.object]]
      path = "events"
      optional = true
      disable_prepend_keys = true
      timestamp_key = "ts_wall_utc"
      timestamp_format = "2006-01-02T15:04:05.999999999Z07:00"

      tags = [
        "session_id",
        "session_state",
        "lap_phase",
        "metric_key",
        "source",
        "unit",
        "quality_flag"
      ]

      [[inputs.mqtt_consumer.json_v2.object.field]]
        path = "lap_number"
        type = "int"

      [[inputs.mqtt_consumer.json_v2.object.field]]
        path = "ts_session_ms"
        type = "int"

      [[inputs.mqtt_consumer.json_v2.object.field]]
        path = "can_id"
        type = "int"

      [[inputs.mqtt_consumer.json_v2.object.field]]
        path = "seq_in_session"
        type = "int"

      [[inputs.mqtt_consumer.json_v2.object.field]]
        path = "metric_value"
        type = "float"


[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["telemetry/eco_archers/sessions"]
  qos = 1
  client_id = "ect-telegraf-sessions-local"
  persistent_session = true
  connection_timeout = "30s"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "sessions_ingest_view"

    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      disable_prepend_keys = true


      included_keys = [
        "session_id",
        "session_name",
        "session_state",
        "laps_completed",
        "crossing_deadzone_ms"
      ]

[[outputs.postgresql]]
  connection = "host=${TS_HOST} port=${TS_PORT} user=${TS_USER} password=${TS_PASSWORD} dbname=${TS_DB} sslmode=disable"
  schema = "telemetry"
  timestamp_column_name = "ts_wall_utc"
  tagexclude = ["topic"]



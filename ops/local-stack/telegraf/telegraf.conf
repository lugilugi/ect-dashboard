[agent]
  flush_interval = "1s"
  metric_batch_size = 1000
  metric_buffer_limit = 20000
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["${TOPIC_EVENTS}"]
  qos = 1
  client_id = "${TELEGRAF_EVENTS_CLIENT_ID}"
  persistent_session = true
  max_undelivered_messages = 250
  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "telemetry_ingest_view"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "events"
      disable_prepend_keys = true
      included_keys = ["schema_version","session_uid","seq_in_session","ts_wall_utc","observed_at_utc","ts_session_ms","lap_number","session_state","lap_phase","signal_name","value","unit","source","quality","sample_kind","source_sample_id","can_id","freshness_ms"]
      tags = ["schema_version","session_uid","seq_in_session","ts_wall_utc","observed_at_utc","ts_session_ms","lap_number","session_state","lap_phase","signal_name","unit","source","quality","sample_kind","source_sample_id","can_id","freshness_ms"]
      # 1.31 array timestamp_key reuses the first time. SQL casts ts_wall_utc.
      [inputs.mqtt_consumer.json_v2.object.fields]
        value = "float"

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["${TOPIC_SESSIONS}"]
  qos = 1
  client_id = "${TELEGRAF_SESSIONS_CLIENT_ID}"
  persistent_session = true
  max_undelivered_messages = 250
  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "sessions_ingest_view"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      disable_prepend_keys = true
      included_keys = ["schema_version","uid","session_name","started_at_utc","ended_at_utc","session_state","laps_completed","metadata_revision"]
      tags = ["schema_version","uid","started_at_utc","ended_at_utc","session_state","laps_completed","metadata_revision"]

[[outputs.postgresql]]
  connection = "host=${TS_HOST} port=${TS_PORT} user=${TS_USER} password=${TS_PASSWORD} dbname=${TS_DB} sslmode=disable"
  timestamp_column_name = "time"
  tagexclude = ["topic"]

# Telegraf pipeline for ECT telemetry ingest.
#
# Expected flow:
#   MQTT topic telemetry/eco_archers/events
#   -> Telegraf mqtt_consumer (json_v2)
#   -> PostgreSQL/TimescaleDB output
#
# Notes:
# - This config emits one metric per decoded event in the payload events[] array.
# - Update output credentials before deploying.

[agent]
  interval = "1s"
  flush_interval = "1s"
  metric_batch_size = 1000
  metric_buffer_limit = 20000
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["telemetry/eco_archers/events"]
  qos = 1
  client_id = "ect-telegraf-timescale"
  persistent_session = true
  connection_timeout = "30s"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "telemetry_events"

    [[inputs.mqtt_consumer.json_v2.object]]
      path = "events"
      optional = true
      disable_prepend_keys = true
      timestamp_key = "ts_wall_utc"
      timestamp_format = "2006-01-02T15:04:05.999999999Z07:00"

      tags = [
        "session_id",
        "session_state",
        "lap_phase",
        "metric_key",
        "source",
        "unit",
        "quality_flag"
      ]

      included_keys = [
        "lap_number",
        "ts_session_ms",
        "can_id",
        "seq_in_session",
        "metric_value"
      ]

[[outputs.postgresql]]
  # Replace before deployment.
  connection = "host=127.0.0.1 port=5432 user=telegraf password=CHANGE_ME dbname=telemetry sslmode=disable"
  schema = "telemetry"

  # Keep metric naming stable so postgres output writes to telemetry.telemetry_events.
  # If your Telegraf build requires explicit templates, add table_template/create_templates here.

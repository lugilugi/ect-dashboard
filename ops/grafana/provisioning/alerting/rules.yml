# Source freshness prevents stale replay from firing live alerts.
apiVersion: 1
groups:
- orgId: 1
  name: ECT Vehicle
  folder: ECT
  interval: 1m
  rules:
  - uid: ect-low-pack-voltage
    title: Pack voltage below 40 V
    condition: C
    disableProvenance: true
    for: 1m
    labels:
      severity: critical
      signal: voltage
    annotations:
      summary: Pack voltage dropped below 40 V (latest session, fresh source observations)
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      datasourceUid: timescaledb
      queryType: ''
      model:
        refId: A
        datasource:
          type: postgres
          uid: timescaledb
        format: table
        rawQuery: true
        rawSql: SELECT MIN(value) AS v FROM latest_signals WHERE signal_name = 'Voltage_780'
          AND is_fresh AND session_uid::text = (SELECT uid::text FROM session_catalog
          ORDER BY started_at DESC LIMIT 1);
        intervalMs: 60000
      relativeTimeRange:
        from: 300
        to: 0
    - refId: B
      datasourceUid: __expr__
      type: reduce
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
      relativeTimeRange:
        from: 0
        to: 0
    - refId: C
      datasourceUid: __expr__
      type: threshold
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 40
          operator:
            type: and
      relativeTimeRange:
        from: 0
        to: 0
  - uid: ect-gps-fallback-active
    title: GPS fallback active
    condition: C
    disableProvenance: true
    for: 2m
    labels:
      severity: warning
      signal: gps
    annotations:
      summary: GPS_Fallback_Active stayed on for 2+ minutes (latest session)
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      datasourceUid: timescaledb
      queryType: ''
      model:
        refId: A
        datasource:
          type: postgres
          uid: timescaledb
        format: table
        rawQuery: true
        rawSql: SELECT MAX(value) AS f FROM latest_signals WHERE signal_name = 'GPS_Fallback_Active'
          AND is_fresh AND session_uid::text = (SELECT uid::text FROM session_catalog
          ORDER BY started_at DESC LIMIT 1);
        intervalMs: 60000
      relativeTimeRange:
        from: 600
        to: 0
    - refId: B
      datasourceUid: __expr__
      type: reduce
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
      relativeTimeRange:
        from: 0
        to: 0
    - refId: C
      datasourceUid: __expr__
      type: threshold
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0.5
          operator:
            type: and
      relativeTimeRange:
        from: 0
        to: 0
  - uid: ect-fault-spike
    title: Motor fault bitfields detected
    condition: C
    disableProvenance: true
    for: 1m
    labels:
      severity: warning
      signal: faults
    annotations:
      summary: Fresh motor fault bitfield is nonzero
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      datasourceUid: timescaledb
      queryType: ''
      model:
        refId: A
        datasource:
          type: postgres
          uid: timescaledb
        format: table
        rawQuery: true
        rawSql: SELECT MAX(value) AS e FROM latest_signals WHERE signal_name IN ('MC_Fault_Flags','MC_Software_Faults')
          AND is_fresh AND session_uid::text = (SELECT uid::text FROM session_catalog
          ORDER BY started_at DESC LIMIT 1);
        intervalMs: 60000
      relativeTimeRange:
        from: 300
        to: 0
    - refId: B
      datasourceUid: __expr__
      type: reduce
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
      relativeTimeRange:
        from: 0
        to: 0
    - refId: C
      datasourceUid: __expr__
      type: threshold
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
      relativeTimeRange:
        from: 0
        to: 0
  - uid: ect-telemetry-stall
    title: Telemetry data stall
    condition: C
    disableProvenance: true
    for: 2m
    labels:
      severity: critical
      signal: pipeline
    annotations:
      summary: No telemetry rows ingested for 90+ seconds (app/broker/ingest down?)
    noDataState: OK
    execErrState: Error
    data:
    - refId: A
      datasourceUid: timescaledb
      queryType: ''
      model:
        refId: A
        datasource:
          type: postgres
          uid: timescaledb
        format: table
        rawQuery: true
        rawSql: SELECT CASE WHEN (SELECT session_state FROM session_catalog ORDER
          BY started_at DESC LIMIT 1)='LOGGING' THEN count(*) ELSE NULL END AS n FROM
          latest_signals WHERE is_fresh AND signal_name='Voltage_780' AND session_uid=(SELECT
          uid FROM session_catalog ORDER BY started_at DESC LIMIT 1);
        intervalMs: 60000
      relativeTimeRange:
        from: 90
        to: 0
    - refId: B
      datasourceUid: __expr__
      type: reduce
      model:
        refId: B
        type: reduce
        expression: A
        reducer: last
      relativeTimeRange:
        from: 0
        to: 0
    - refId: C
      datasourceUid: __expr__
      type: threshold
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
      relativeTimeRange:
        from: 0
        to: 0

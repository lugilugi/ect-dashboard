apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: timescaledb
    type: postgres
    access: proxy
    url: timescaledb:5432
    user: postgres
    jsonData:
      database: telemetry
      sslmode: disable
      postgresVersion: 1500
      timescaledb: true
    secureJsonData:
      password: postgres
    editable: true
    isDefault: true

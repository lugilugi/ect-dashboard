name: Android Release Build

on:
  workflow_dispatch: # Manual trigger from the Actions tab
  push:
    tags:
      - '*' # e.g. v1.0.0

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Analyze, Test & Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Needed to create a GitHub Release
    # The `secrets` context cannot be used directly in step `if:` conditions,
    # so the keystore presence is resolved once here at job level.
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.5'
          cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub --reporter expanded

      # Release signing: inject the keystore from repository secrets when
      # configured. Without secrets the build falls back to the debug key
      # (see android/app/build.gradle.kts), which is fine for local testing
      # but CANNOT be installed as an update over a previously-signed APK:
      # Android requires every update to be signed with the SAME key.
      # Signing correctly is what lets you update the app in place from
      # GitHub Releases instead of uninstalling and reinstalling.
      - name: Decode release keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          # Quoted delimiter ('EOF'): without it bash would expand any "$var"-
          # looking substrings inside the passwords (e.g. "$v4Hs6x") and the
          # keystore password would come out corrupted.
          cat > android/key.properties <<'EOF'
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
          chmod 600 android/key.properties

      - name: Derive version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            build_name="${GITHUB_REF_NAME#v}"
            build_name="${build_name#.}" # tolerate typo'd tags like v.2.2.1
            echo "build_name=${build_name}" >> "$GITHUB_OUTPUT"
          else
            echo "build_name=1.0.0" >> "$GITHUB_OUTPUT"
          fi

      # Without the release keystore the build would silently fall back to the
      # runner's ephemeral debug key: a NEW key on every run, so every update
      # fails with a signature mismatch ("App not installed"). Fail loudly
      # instead of publishing such an APK.
      - name: Require release keystore
        if: env.HAS_RELEASE_KEYSTORE != 'true'
        run: |
          echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Refusing to build: an APK signed with the fallback debug key cannot be installed as an update over a previously-signed version. Configure the 4 ANDROID_KEYSTORE_* secrets and re-run."
          exit 1

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.build_name }} \
            --build-number=${{ github.run_number }}

      - name: Verify APK signing certificate
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $SDK/build-tools"
            exit 1
          fi
          CERT=$( "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk \
                   | sed -n 's/.*SHA-256 digest: //p' )
          # Read credentials from the key.properties the decode step wrote
          # (variable content is never re-expanded by bash, unlike inlining
          # a secret with "$" characters into a double-quoted string).
          STORE_PASS=$(sed -n 's/^storePassword=//p' android/key.properties)
          KEY_ALIAS=$(sed -n 's/^keyAlias=//p' android/key.properties)
          EXPECTED=$( keytool -list -v -keystore android/app/upload-keystore.jks \
                       -storepass "$STORE_PASS" -alias "$KEY_ALIAS" \
                       | sed -n 's/^[[:space:]]*SHA256: //p' )
          echo "APK  cert: ${CERT}"
          echo "Key  cert: ${EXPECTED}"
          if [ -n "$CERT" ] && [ "$CERT" = "$EXPECTED" ]; then
            echo "Signing certificate matches the release keystore."
          else
            echo "::error::APK signed with an unexpected certificate; refusing to publish."
            exit 1
          fi

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk \
              build/app/outputs/flutter-apk/ect-dashboard.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ect-dashboard-apk
          path: build/app/outputs/flutter-apk/ect-dashboard.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/ect-dashboard.apk
          generate_release_notes: true

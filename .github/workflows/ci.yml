name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CAN generator dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify generated CAN decoder
        run: |
          test -f lib/models/telemetry/generated/can_database.g.dart
          git ls-files --error-unmatch lib/models/telemetry/generated/can_database.g.dart > /dev/null
          python tools/generate_can_dart.py
          dart format lib/models/telemetry/generated/can_database.g.dart
          git diff --exit-code -- lib/models/telemetry/generated/can_database.g.dart

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub --reporter expanded

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-results
          path: build/
          if-no-files-found: ignore
